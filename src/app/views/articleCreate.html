<div>
    <form data-ng-submit="$article.createArticle()">
        <input type="text" data-ng-model="$article.data.title" />
        <input type="text" data-ng-model="$article.data.shortDescription" />
        <input type="text" data-ng-model="$article.data.description" />
        <input type="text" data-ng-model="$article.data.tags" />
        <button type="submit">Create Article</button>
    </form>
</div>
