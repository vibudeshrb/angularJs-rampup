<div class="signup-container">
    <h2>Sign Up Page</h2>
    <form data-ng-submit="$signup.registerUser()">
        <div>
        <label>Username</label>
        <input type="text" data-ng-model="$signup.user.username">
        <span data-ng-if="$signup.usernameError">{{$signup.usernameError}}</span>
        </div>
        <div>
        <label>Email</label>
        <input type="email" data-ng-model="$signup.user.email">
        <span data-ng-if="$signup.emailError">{{$signup.emailError}}</span>
        </div>
        <div>
        <label>Password</label>
        <input type="password" data-ng-model="$signup.user.password">
        <span data-ng-if="$signup.passwordError">{{$signup.passwordError}}</span>
        </div>
        <span data-ng-if="$signup.error">{{$signup.error}}</span>
          <button type="submit">Submit</button>
    </form> 
</div>
